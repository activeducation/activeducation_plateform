# ============================================================
# app.conf - Serveur statique pour l'App Etudiante (Flutter Web)
# Ce conteneur nginx sert uniquement les fichiers statiques.
# Le SSL, le routing et les headers de securite sont geres par Traefik.
# ============================================================

server {
    listen 80;
    root /var/www/html;
    index index.html;

    # -------------------------------------------------------
    # Optimisations TCP
    # -------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    reset_timedout_connection on;

    # -------------------------------------------------------
    # Cache fichiers frequemment accedés (metadata)
    # -------------------------------------------------------
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # -------------------------------------------------------
    # Compression gzip - optimisée pour le web moderne
    # -------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_buffers        16 8k;
    gzip_min_length     256;        # Compresser fichiers plus petits aussi
    gzip_http_version   1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/x-font-ttf
        application/x-font-woff
        application/vnd.ms-fontobject;

    # Prefilter pour contenus souvent compressés
    gzip_proxied        expired no-cache no-store private auth;

    # Servir les fichiers pre-compresses .gz si disponibles
    gzip_static on;

    # -------------------------------------------------------
    # Buffers optimisés pour fichiers statiques
    # -------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # -------------------------------------------------------
    # Flutter Web SPA : toutes les routes inconnues -> index.html
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tres long pour les assets Flutter
    # (le nom de fichier contient un hash de contenu - safe pour immutable)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        tcp_nodelay off;  # pipelining OK pour fichiers
    }

    # Cache moyen pour medias (images, fonts) - hash dans URL
    location ~* \.(mp4|webm|ogg|mp3|wav|flac|aac)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Pas de cache pour index.html (point d'entree SPA)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff";
        expires 0;
    }

    # Pas de cache pour le manifest PWA
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Pas de cache pour flutter_service_worker.js
    # (le navigateur doit toujours verifier les mises a jour du SW)
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        expires 0;
    }

    # Pas de cache pour les donnees JSON API locales
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }
}
