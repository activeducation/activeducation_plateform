# ============================================================
# app.conf - Serveur statique pour l'App Etudiante (Flutter Web)
# Ce conteneur nginx sert uniquement les fichiers statiques.
# Le SSL, le routing et les headers de securite sont geres par Traefik.
# ============================================================

server {
    listen 80;
    root /var/www/html;
    index index.html;

    # -------------------------------------------------------
    # Optimisations TCP
    # -------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    reset_timedout_connection on;

    # -------------------------------------------------------
    # Cache fichiers frequemment accedés (metadata)
    # -------------------------------------------------------
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # -------------------------------------------------------
    # Compression gzip - optimisée pour le web moderne
    # -------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_buffers        16 8k;
    gzip_min_length     256;        # Compresser fichiers plus petits aussi
    gzip_http_version   1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/x-font-ttf
        application/x-font-woff
        application/vnd.ms-fontobject;

    # Prefilter pour contenus souvent compressés
    gzip_proxied        expired no-cache no-store private auth;

    # Servir les fichiers pre-compresses .gz si disponibles
    gzip_static on;

    # -------------------------------------------------------
    # Buffers optimisés pour fichiers statiques
    # -------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # =======================================================
    # LANDING (page vitrine statique) — racine du domaine
    # Fichiers dans /var/www/html (volume ./landing).
    # =======================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html de la landing : pas de cache (point d'entree)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff";
        expires 0;
    }

    # SW auto-destructeur a la racine : neutralise l'ancien service worker
    # Flutter (scope "/") des visiteurs deja venus. Toujours revérifié.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        expires 0;
    }

    # =======================================================
    # APP FLUTTER — servie sous /app/ (build base-href=/app/)
    # Fichiers dans /var/www/html/app (volume ./activ_education_app/build/web).
    # ^~ : priorite sur les regex d'assets (sinon /app/main.dart.js serait
    # cherche a la racine et renverrait 404).
    # =======================================================
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;

        # index.html de l'app : jamais en cache (point d'entree SPA)
        location = /app/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
            expires 0;
        }
        # SW de l'app : toujours revérifié
        location = /app/flutter_service_worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
            expires 0;
        }
        # manifest PWA de l'app
        location = /app/manifest.json {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff";
        }
        # assets hashes de l'app : cache long immutable
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
        }
    }
    # /app -> /app/
    location = /app { return 301 /app/; }

    # =======================================================
    # Assets de la landing (racine) : cache moyen
    # =======================================================
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }
}
