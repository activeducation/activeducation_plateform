name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "activ_education_app/**"
      - "admin_dashboard/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "activ_education_app/**"
      - "admin_dashboard/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  analyze-student-app:
    name: Analyze Student App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activ_education_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Tests ADVISORY — voir backend-ci.yml pour la justification.
      # TODO : remettre les tests UI à niveau dans PR dédiée.
      - name: Run tests with coverage (advisory)
        continue-on-error: true
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-student-coverage
          path: activ_education_app/coverage/
          retention-days: 7

  analyze-admin-dashboard:
    name: Analyze Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Tests ADVISORY — voir backend-ci.yml pour la justification.
      - name: Run tests (advisory)
        continue-on-error: true
        run: flutter test

  build-web:
    name: Build Web (Student App)
    runs-on: ubuntu-latest
    needs: analyze-student-app
    defaults:
      run:
        working-directory: activ_education_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # --no-tree-shake-icons : un IconData avec codepoint 0 (probablement
      # dans une icône par défaut/fallback) fait planter IconTreeShaker.
      # Coût : MaterialIcons-Regular passe de 21KB à 1.6MB (mais ~150KB
      # compressé gzip — impact réel marginal sur web).
      # TODO : auditer les IconData() pour trouver le codepoint 0 fautif.
      - name: Build web
        run: flutter build web --release --no-tree-shake-icons
